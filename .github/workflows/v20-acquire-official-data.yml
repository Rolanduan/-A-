name: V20 acquire official raw data
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Download 28 Census originals and supplemental official datasets
        shell: bash
        run: |
          python - <<'PY'
          import csv,datetime as dt,gzip,hashlib,json,pathlib,time,urllib.error,urllib.request,zipfile
          root=pathlib.Path("V20_RAW_DATA"); off=root/"data/raw_official/v20"; sup=root/"data/raw_supplemental/v20"; qa=root/"qa_v20"
          off.mkdir(parents=True,exist_ok=True);sup.mkdir(parents=True,exist_ok=True);qa.mkdir(parents=True,exist_ok=True)
          ua="Y-CITY-SYORA-V20-Data-Acquisition/1.0 (bounded public research)"
          jobs=[]; base="https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/data/5YRData/"
          for t in ["B01001","B25070","B28002","B17001"]:
            jobs.append((f"ACS_{t}",base+f"acsdt5y2024-{t.lower()}.dat",off/f"acs_2024_5y_{t}.dat","DAT"))
          for st in ["06","08","13","17","25","27","37","41","42","48","53","55"]:
            jobs += [(f"TIGER_PLACE_{st}",f"https://www2.census.gov/geo/tiger/TIGER2024/PLACE/tl_2024_{st}_place.zip",off/f"tl_2024_{st}_place.zip","ZIP"),
                     (f"TIGER_TRACT_{st}",f"https://www2.census.gov/geo/tiger/TIGER2024/TRACT/tl_2024_{st}_tract.zip",off/f"tl_2024_{st}_tract.zip","ZIP")]
          jobs.append(("NCES_CCD_2024_25_DIRECTORY","https://nces.ed.gov/ccd/Data/zip/ccd_sch_029_2425_w_0a_051425.zip",sup/"ccd_sch_029_2425_w_0a_051425.zip","ZIP"))
          jobs.append(("NCES_CCD_2024_25_LUNCH_V1A","https://nces.ed.gov/ccd/Data/zip/ccd_sch_033_2425_l_1a_073025.zip",sup/"ccd_sch_033_2425_l_1a_073025.zip","ZIP"))
          jobs.append(("NCES_CCD_2024_25_LEA_DIRECTORY","https://nces.ed.gov/ccd/Data/zip/ccd_lea_029_2425_w_0a_051425.zip",sup/"ccd_lea_029_2425_w_0a_051425.zip","ZIP"))
          for st in ["06","08","13","17","25","27","37","41","42","48","53","55"]:
            for typ in ["ELSD","SCSD","UNSD"]:
              jobs.append((f"TIGER_{typ}_{st}",f"https://www2.census.gov/geo/tiger/TIGER2024/{typ}/tl_2024_{st}_{typ.lower()}.zip",off/f"tl_2024_{st}_{typ.lower()}.zip","ZIP"))
          for c in ["44201","42401","42101","42602","88101"]:
            jobs.append((f"EPA_AIR_{c}_2024",f"https://aqs.epa.gov/aqsweb/airdata/daily_{c}_2024.zip",sup/f"daily_{c}_2024.zip","ZIP"))
          for fn in ["ghcnd-stations.txt","ghcnd-inventory.txt","readme.txt","ghcnd-version.txt"]:
            jobs.append((f"NOAA_{fn}",f"https://www.ncei.noaa.gov/pub/data/ghcn/daily/{fn}",sup/fn,"TXT"))
          jobs.append(("NOAA_GHCN_2024_BY_YEAR","https://www.ncei.noaa.gov/pub/data/ghcn/daily/by_year/2024.csv.gz",sup/"2024.csv.gz","GZIP"))
          receipts=[]
          for sid,url,path,fmt in jobs:
            status="FAILED";err=None;final=None;ctype=None;tmp=path.with_suffix(path.suffix+".part")
            for attempt in range(3):
              try:
                req=urllib.request.Request(url,headers={"User-Agent":ua,"Accept":"*/*"})
                with urllib.request.urlopen(req,timeout=120) as r:
                  final=r.geturl();ctype=r.headers.get("Content-Type","")
                  with tmp.open("wb") as f:
                    while True:
                      b=r.read(1024*1024)
                      if not b:break
                      f.write(b)
                if not tmp.stat().st_size:raise RuntimeError("EMPTY")
                with tmp.open("rb") as f: head=f.read(512).lstrip().lower()
                if head.startswith(b"<html") or head.startswith(b"<!doctype html"):raise RuntimeError("HTML_NOT_RAW")
                if fmt=="ZIP":
                  with zipfile.ZipFile(tmp) as z:
                    bad=z.testzip()
                    if bad:raise RuntimeError("ZIP_CRC:"+str(bad))
                if fmt=="GZIP":
                  with gzip.open(tmp,"rb") as f:f.read(128)
                if fmt=="DAT":
                  with tmp.open(encoding="utf-8-sig",newline="") as f:h=next(csv.reader(f,delimiter="|"))
                  table=sid.split("_",1)[1]
                  fields={"B01001":["B01001_E006","B01001_M006","B01001_E030","B01001_M030"],
                          "B25070":["B25070_E001","B25070_M001","B25070_E007","B25070_M007","B25070_E008","B25070_M008","B25070_E009","B25070_M009","B25070_E010","B25070_M010","B25070_E011","B25070_M011"],
                          "B28002":["B28002_E001","B28002_M001","B28002_E004","B28002_M004"],
                          "B17001":["B17001_E001","B17001_M001","B17001_E002","B17001_M002"]}[table]
                  if "GEO_ID" not in h or not set(fields)<=set(h):raise RuntimeError("ACS_SCHEMA_FAIL")
                tmp.replace(path);status="DOWNLOADED_RAW_BYTES";err=None;break
              except urllib.error.HTTPError as e:
                err=f"HTTP_{e.code}:{e.reason}"
                if e.code in (403,429):break
              except Exception as e:err=repr(e)
              time.sleep(2**attempt)
            receipts.append({"source_id":sid,"url":url,"final_url":final,"status":status,"format":fmt,
              "bytes":path.stat().st_size if status=="DOWNLOADED_RAW_BYTES" else 0,
              "sha256":hashlib.sha256(path.read_bytes()).hexdigest() if status=="DOWNLOADED_RAW_BYTES" else None,
              "path":str(path),"content_type":ctype,"error":err,"retrieved_utc":dt.datetime.now(dt.timezone.utc).isoformat()})
            print(sid,status,receipts[-1]["bytes"],err or "")
          manifest={"generated_utc":dt.datetime.now(dt.timezone.utc).isoformat(),"expected":len(jobs),
            "downloaded":sum(x["status"]=="DOWNLOADED_RAW_BYTES" for x in receipts),"receipts":receipts}
          (qa/"V20_RAW_SOURCE_MANIFEST.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
          print("SOURCE_RESULT",manifest["downloaded"],"/",manifest["expected"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v20-official-raw-data
          path: V20_RAW_DATA/
          if-no-files-found: warn
          retention-days: 14

  build-real-osm-networks:
    needs: acquire
    if: always() && needs.acquire.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v20-official-raw-data
          path: V20_RAW_DATA/
      - name: Extract V19 engine and stage acquired Census originals
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,shutil,zipfile,sys
          root=pathlib.Path(".")
          m=json.loads((root/"V20_RAW_DATA/qa_v20/V20_RAW_SOURCE_MANIFEST.json").read_text())
          core=[x for x in m["receipts"] if x["source_id"].startswith("ACS_") or x["source_id"].startswith("TIGER_PLACE_") or x["source_id"].startswith("TIGER_TRACT_")]
          if len(core)!=28 or any(x["status"]!="DOWNLOADED_RAW_BYTES" for x in core):
              raise SystemExit("BLOCKED: not all 28 core Census originals passed download and format checks")
          with zipfile.ZipFile("V19_UNIFIED_COMPLETE_AUTORUN_RESEARCH_PACKAGE.zip") as z:
              z.extractall("V19_PACKAGE")
          proj=root/"V19_PACKAGE/Y_CITY_SYORA_V19"
          target=proj/"data/raw_official/v19";target.mkdir(parents=True,exist_ok=True)
          for f in (root/"V20_RAW_DATA/data/raw_official/v20").iterdir():
              shutil.copy2(f,target/f.name)
          print("STAGED_CORE_ORIGINALS",len(list(target.iterdir())))
          PY
      - name: Install V19 GIS engine dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz gdal-bin libgdal-dev libspatialindex-dev
          python -m pip install --upgrade pip
          python -m pip install -r V19_PACKAGE/Y_CITY_SYORA_V19/code_v19/requirements_v19.txt
      - name: Build tract origins and acquire twelve real OSM walking networks
        shell: bash
        run: |
          cd V19_PACKAGE/Y_CITY_SYORA_V19
          PYTHONPATH=code_v19 python code_v19/run_v19.py --stage geography
          PYTHONPATH=code_v19 python code_v19/run_v19.py --stage networks --network overpass
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v20-osm-network-evidence
          path: |
            V19_PACKAGE/Y_CITY_SYORA_V19/data/raw_osm/
            V19_PACKAGE/Y_CITY_SYORA_V19/data/processed/v19_network/
            V19_PACKAGE/Y_CITY_SYORA_V19/data/processed/v19_gis/
            V19_PACKAGE/Y_CITY_SYORA_V19/qa_v19/
          if-no-files-found: warn
          retention-days: 14
